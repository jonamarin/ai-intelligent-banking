# Scrape config for the local, optional `monitoring` docker-compose profile
# (docs/project-status.md § Phase 13 detail; src/monitoring/README.md).
# No production target exists (.claude/rules/infrastructure.md) -- this
# scrapes the local `api` service's own /metrics endpoint only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-investigator-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
