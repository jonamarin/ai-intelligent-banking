services:
  api:
    build: .
    ports:
      # Host port 8080 avoids clashing with something else already using 8000
      # on this machine; the container still listens on 8000 internally.
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking_ai
    ports:
      # Host port 5433 avoids clashing with a locally-installed PostgreSQL on
      # the default 5432 — containers still talk to `db` on 5432 internally.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 13 (docs/observability.md § 4, docs/project-status.md § Phase 13
  # detail) — optional, local-only. Never started by a plain
  # `docker compose up`; opt in with `docker compose --profile monitoring
  # up -d` (or `make monitoring-up`) precisely because this machine has
  # been memory-constrained throughout the project (docs/project-status.md
  # § Known limitations) and most work doesn't need it running.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    ports:
      # Host port 3001 avoids clashing with something else already using
      # 3000 on this development machine — container still listens on 3000
      # internally.
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
